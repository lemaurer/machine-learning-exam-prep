name: Apply manual correct UI patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-manual-correct.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch session UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/ExamPrepApp.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '  answerProgress,\n  applyEdits,',
              '  answerProgress,\n  markLatestAttemptCorrect,\n  applyEdits,',
          )

          replace_once(
              '  const [editing, setEditing] = useState(false);\n',
              '  const [editing, setEditing] = useState(false);\n  const [manuallyCorrectedIds, setManuallyCorrectedIds] = useState<string[]>([]);\n',
          )

          replace_once(
              '    setSessionAnswers([]);\n    setEditing(false);',
              '    setSessionAnswers([]);\n    setManuallyCorrectedIds([]);\n    setEditing(false);',
          )

          replace_once(
              '  function markDone(questionId: string) {\n    persistProgress((current) => ({ ...current, [questionId]: setQuestionStatus(current[questionId], "done") }));\n  }\n\n  function saveQuestionEdit',
              '''  function markDone(questionId: string) {\n    persistProgress((current) => ({ ...current, [questionId]: setQuestionStatus(current[questionId], "done") }));\n  }\n\n  function markCurrentAnswerCorrect() {\n    if (!currentQuestion || !feedbackVisible || mode === "exam") return;\n\n    setSessionAnswers((answers) => {\n      const next = [...answers];\n      for (let index = next.length - 1; index >= 0; index -= 1) {\n        if (next[index].questionId === currentQuestion.id && !next[index].correct) {\n          next[index] = { ...next[index], correct: true };\n          break;\n        }\n      }\n      return next;\n    });\n    setManuallyCorrectedIds((ids) => ids.includes(currentQuestion.id) ? ids : [...ids, currentQuestion.id]);\n    persistProgress((current) => {\n      const corrected = markLatestAttemptCorrect(current[currentQuestion.id]);\n      return corrected ? { ...current, [currentQuestion.id]: corrected } : current;\n    });\n  }\n\n  function saveQuestionEdit''',
          )

          replace_once(
              '          status={progress[currentQuestion.id]?.status ?? "new"}\n          onChoose={chooseAnswer}',
              '          status={progress[currentQuestion.id]?.status ?? "new"}\n          manuallyCorrected={manuallyCorrectedIds.includes(currentQuestion.id)}\n          onChoose={chooseAnswer}',
          )

          replace_once(
              '          onQueueReview={() => queueForReview(currentQuestion.id)}\n          onFigureUpload=',
              '          onQueueReview={() => queueForReview(currentQuestion.id)}\n          onMarkCorrect={markCurrentAnswerCorrect}\n          onFigureUpload=',
          )

          replace_once(
              '  status,\n  onChoose,',
              '  status,\n  manuallyCorrected,\n  onChoose,',
          )

          replace_once(
              '  onQueueReview,\n  onFigureUpload,',
              '  onQueueReview,\n  onMarkCorrect,\n  onFigureUpload,',
          )

          replace_once(
              '  status: "new" | "done" | "review";\n  onChoose:',
              '  status: "new" | "done" | "review";\n  manuallyCorrected: boolean;\n  onChoose:',
          )

          replace_once(
              '  onQueueReview: () => void;\n  onFigureUpload:',
              '  onQueueReview: () => void;\n  onMarkCorrect: () => void;\n  onFigureUpload:',
          )

          replace_once(
              '  const isCorrect = feedbackVisible && isCorrectSelection(question, selectedIds);',
              '  const isCorrect = feedbackVisible && (manuallyCorrected || isCorrectSelection(question, selectedIds));',
          )

          replace_once(
              '{isCorrect ? "Correct" : `Incorrect · Correct answer${expectedIds.length > 1 ? "s" : ""}: ${expectedLabel}`}',
              '{manuallyCorrected ? "Marked correct manually" : isCorrect ? "Correct" : `Incorrect · Correct answer${expectedIds.length > 1 ? "s" : ""}: ${expectedLabel}`}',
          )

          replace_once(
              '{feedbackVisible && mode !== "exam" && (\n          <div className="next-row"><div>{!isCorrect || status === "review" ? <span>Saved in Review</span> : mode === "review" ? <span>Cleared from Review</span> : <button className="secondary-button compact" onClick={onQueueReview}>Save to Review for later</button>}</div><button className="primary-button compact" onClick={onNext}>{index + 1 === total ? "See session review" : "Next question"}<span>→</span></button></div>\n        )}',
              '''{feedbackVisible && mode !== "exam" && (\n          <div className="next-row">\n            <div className="session-actions">\n              {!isCorrect && <button className="secondary-button compact" onClick={onMarkCorrect}>Mark as correct</button>}\n              {status === "review" ? <span>Saved in Review</span> : <button className="secondary-button compact" onClick={onQueueReview}>Save to Review for later</button>}\n            </div>\n            <button className="primary-button compact" onClick={onNext}>{index + 1 === total ? "See session review" : "Next question"}<span>→</span></button>\n          </div>\n        )}''',
          )

          path.write_text(text)
          PY
      - name: Remove one-off workflow
        run: git rm .github/workflows/apply-manual-correct.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ExamPrepApp.tsx
          git commit -m "Allow accidental answers to be marked correct"
          git push
